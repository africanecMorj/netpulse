services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: netpulse
      POSTGRES_USER: netpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netpulse_dev_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - netpulse_pgdata:/var/lib/postgresql/data
      - ./netpulse-backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netpulse -d netpulse"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  backend:
    build:
      context: ./netpulse-backend
      dockerfile: Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://netpulse:${POSTGRES_PASSWORD:-netpulse_dev_password}@postgres:5432/netpulse?sslmode=disable"
      JWT_SECRET: ${JWT_SECRET:-local-development-only-change-this-secret-32bytes}
      CHECK_INTERVAL: 10s
      REQUEST_TIMEOUT: 3s
      METRICS_RETENTION_DAYS: 30
      NETPULSE_TEST_SERVER_ENABLED: "true"
      NETPULSE_TEST_SERVER_URL: http://testserver:8090
      NETPULSE_TEST_CONTROL_TOKEN: ${NETPULSE_TEST_CONTROL_TOKEN:-local-test-control-token-change-this-32bytes}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  testserver:
    build:
      context: ./netpulse-backend
      dockerfile: testserver/Dockerfile
    hostname: test-server
    environment:
      NETPULSE_WS_URL: ws://backend:8080/api/v1/agents/ws
      NETPULSE_TEST_CONTROL_TOKEN: ${NETPULSE_TEST_CONTROL_TOKEN:-local-test-control-token-change-this-32bytes}
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  netpulse_pgdata:
